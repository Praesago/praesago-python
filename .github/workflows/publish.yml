# Publishes to PyPI when a release tag v* is pushed. Uses PyPI trusted publishing: no token is stored anywhere.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - run: PYTHONPATH=src pytest -q tests
      - name: Tag matches the package version
        run: test "v$(python -c 'import sys; sys.path.insert(0, "src"); import praesago; print(praesago.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
